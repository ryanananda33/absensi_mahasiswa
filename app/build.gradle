plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.pab.absensi_mahasiswa'
    compileSdk 34

    defaultConfig {
        applicationId "com.pab.absensi_mahasiswa"
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // FITUR MASTER LEVEL: Mengaktifkan ViewBinding agar kode lebih efisien dan rapi
    buildFeatures {
        viewBinding = true
    }

    // SOLUSI UNTUK: Android 16 KB Alignment (Menghilangkan Warning saat Run)
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    // Library Dasar AndroidX
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.activity.ktx

    // Networking: Retrofit & GSON (Koneksi API)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // Google Play Services: GPS/Location (Poin Inovasi)
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // --- TAMBAHAN MASTER LEVEL (PENTING) ---

    // CameraX: Untuk fitur Bukti Foto Selfie saat Absen (Face Capture)
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // Glide: Untuk memproses dan menampilkan foto dengan sangat cepat
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Google ML Kit: Jantung dari Autentikasi Wajah & Teks (OCR)
    implementation 'com.google.mlkit:face-detection:16.1.6'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'

    // WorkManager: Untuk background task (Poin Inovasi)
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}